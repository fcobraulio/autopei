[project]
name = "autopei"
version = "1.1.0"
description = "AutoPEI — Plano Educacional Individualizado com fluxo de preenchimento (NAPNE/IFRN)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.50",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-docx>=1.1",
    "pandas>=2.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyflakes>=3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
